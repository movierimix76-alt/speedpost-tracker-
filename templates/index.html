<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedPost Tracking Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f9fa; margin: 0; padding: 10px; box-sizing: border-box; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn { flex: 1; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; color: white; }
        .add-btn { background: #007aff; }
        .track-btn { background: #34c759; }
        .tabs { display: flex; justify-content: space-around; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; position: sticky; top: 0; z-index: 100; }
        .tab { font-weight: bold; color: #888; cursor: pointer; padding: 5px 15px; border-radius: 20px; transition: 0.2s; }
        .tab.active { color: white; background: #ff6b35; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; flex-direction: column; gap: 10px; border-left: 5px solid #ff6b35; }
        .card.delivered-border { border-left-color: #34c759; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; color: #222; text-transform: capitalize; }
        .status { font-weight: bold; font-size: 13px; padding: 3px 8px; border-radius: 5px; display: inline-block; margin-top: 5px; }
        .status-transit { background: #e3f2fd; color: #007aff; }
        .status-delivered { background: #e8f5e9; color: #34c759; }
        .timeline { background: #f8f9fa; border-radius: 8px; padding: 10px; font-size: 12px; color: #444; }
        .timeline-title { font-weight: bold; color: #333; margin-bottom: 5px; }
        .journey-step { border-left: 2px solid #ddd; padding-left: 10px; margin-left: 5px; padding-bottom: 8px; position: relative; }
        .journey-step::before { content: ''; position: absolute; left: -5px; top: 3px; width: 8px; height: 8px; background: #bbb; border-radius: 50%; }
        .journey-step.latest::before { background: #ff6b35; }
        .journey-date { color: #888; font-size: 11px; }
        .actions { display: flex; gap: 8px; justify-content: flex-end; width: 100%; border-top: 1px solid #f1f1f1; padding-top: 8px; }
        .wa-btn { background-color: #25D366; color: white; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; font-weight: bold; text-decoration: none; display: inline-flex; align-items: center; }
        .refresh-btn { background: #e0e0e0; color: #333; border: none; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold; }
        .del-btn { background: none; color: #ff3b30; border: none; font-size: 12px; cursor: pointer; font-weight: bold; }
        
        /* 🎯 स्क्रीन के बिल्कुल बीच (Center) में पॉप-अप लाने का एकदम सही कोड */
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
        .captcha-popup { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 20px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.25); z-index: 1000; width: 85%; max-width: 320px; text-align: center; box-sizing: border-box; }
        .captcha-popup h3 { margin-top: 0; color: #333; font-size: 18px; }
        .captcha-img-box { background: #f0f0f0; min-height: 50px; display: flex; align-items: center; justify-content: center; border-radius: 8px; margin: 12px 0; border: 1px dashed #bbb; font-weight: bold; color: #555; }
        .captcha-popup img { max-width: 100%; height: auto; border-radius: 5px; display: block; }
        .captcha-popup input { width: 100%; padding: 12px; margin-bottom: 15px; border: 2px solid #ff6b35; border-radius: 8px; text-align: center; font-size: 18px; font-weight: bold; box-sizing: border-box; }
        .captcha-popup button { background: #ff6b35; color: white; border: none; width: 100%; padding: 12px; border-radius: 8px; font-weight: bold; font-size: 15px; cursor: pointer; box-shadow: 0 3px 6px rgba(255,107,53,0.3); }
    </style>
</head>
<body>

    <div class="btn-group">
        <button class="action-btn add-btn" onclick="addManualParcel()">➕ नया पार्सल जोड़ें</button>
        <button class="action-btn track-btn" onclick="askCaptchaDirect()">🔍 कूरियर ट्रैक करें</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="filterTab('all', this)">All</div>
        <div class="tab" onclick="filterTab('shipping', this)">Shipping 🚚</div>
        <div class="tab" onclick="filterTab('delivered', this)">Delivered ✅</div>
    </div>

    <div id="shipments-container">
        <p style="text-align: center; color: #888;">लोड हो रहा है...</p>
    </div>

    <div class="overlay" id="overlay" onclick="closePopup()"></div>
    <div class="captcha-popup" id="captcha-box">
        <h3>🛡️ डाक सेवा सत्यापन</h3>
        <p style="font-size: 12px; color: #666; margin: 0;">नीचे दिख रहा कैप्चा कोड (अंक या अक्षर) भरें:</p>
        <div class="captcha-img-box" id="captcha-img-container">⏳ लोड हो रहा है...</div>
        <input type="text" id="captcha-input" placeholder="यहाँ कोड टाइप करें" autocomplete="off">
        <button id="captcha-submit-btn">सत्यापित करें ✅</button>
    </div>

    <script>
        let currentActiveId = null;
        let currentDirectTrackingNo = null;

        async function loadShipments() {
            try {
                let response = await fetch('/api/shipments');
                let data = await response.json();
                renderCards(data);
            } catch (e) {
                document.getElementById('shipments-container').innerHTML = '<p style="color:red; text-align:center;">त्रुटि!</p>';
            }
        }

        function renderCards(shipments) {
            let container = document.getElementById('shipments-container');
            container.innerHTML = '';
            if(!shipments || shipments.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#bbbbbb; margin-top:50px;">कोई पार्सल नहीं मिला।</p>';
                return;
            }
            shipments.reverse().forEach(item => {
                let isDelivered = (item.status || "").includes('Delivered');
                let statusClass = isDelivered ? 'status-delivered' : 'status-transit';
                let borderClass = isDelivered ? 'delivered-border' : '';
                
                let imgText = item.image_url ? `\n\n🖼️ पार्सल फोटो देखें: ${item.image_url}` : '';
                let waMsg = `नमस्ते ${item.name || 'Customer'}! आपका पार्सल (${item.tracking_no}) का लाइव स्टेटस है: *${item.status || 'In Transit'}*।${imgText}`;
                let wa1 = `https://wa.me/91${item.mobile1}?text=${encodeURIComponent(waMsg)}`;

                let historyHtml = '<div class="timeline"><div class="timeline-title">📍 पार्सल जर्नी ट्रैक हिस्ट्री:</div>';
                if (item.history && item.history.length > 0) {
                    item.history.forEach((step, idx) => {
                        historyHtml += `
                            <div class="journey-step ${idx === 0 ? 'latest' : ''}">
                                <div><b>${step.location}</b>: ${step.details}</div>
                                <div class="journey-date">${step.date}</div>
                            </div>`;
                    });
                } else {
                    historyHtml += '<div class="journey-step latest"><div>पूरी जर्नी देखने के लिए कृपया एक बार रिफ्रेश करें।</div></div>';
                }
                historyHtml += '</div>';

                container.innerHTML += `
                    <div class="card ${borderClass}" data-status="${isDelivered ? 'delivered' : 'shipping'}">
                        <div style="padding: 10px 15px 0 15px;">
                            <div class="info">
                                <h3>${item.name || 'Unknown'}</h3>
                                <p><b>#${item.tracking_no}</b></p>
                                <span class="status ${statusClass}">${item.status || 'In Transit 🚚'}</span>
                                <p style="font-size:11px; margin-top:8px;">📱 ${item.mobile1 || ''}</p>
                            </div>
                        </div>
                        <div style="padding: 0 15px;">${historyHtml}</div>
                        <div class="actions" style="padding: 10px 15px;">
                            <a href="${wa1}" target="_blank" class="wa-btn">🟢 WhatsApp</a>
                            <button class="refresh-btn" onclick="openCaptcha('${item._id}', null)">🔄 रिफ्रेश स्टेटस</button>
                            <button class="del-btn" onclick="deleteItem('${item._id}')">🗑️ डिलीट</button>
                        </div>
                    </div>
                `;
            });
        }

        async function openCaptcha(id, directTrackingNo) {
            currentActiveId = id;
            currentDirectTrackingNo = directTrackingNo;
            document.getElementById('captcha-input').value = '';
            
            document.getElementById('captcha-img-container').innerText = '⏳ डाक सेवा से लोड हो रहा है...';
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('captcha-box').style.display = 'block';
            
            try {
                let res = await fetch('/api/get_captcha');
                let data = await res.json();
                if(data.captcha_text) {
                    // अगर डाक सेवा ऐप का नया टेक्स्ट मोड काम करता है (जैसे: 5 + 2 = ?)
                    document.getElementById('captcha-img-container').innerHTML = `<span style="font-size:22px; color:#ff6b35;">${data.captcha_text}</span>`;
                } else if(data.captcha_img) {
                    document.getElementById('captcha-img-container').innerHTML = `<img src="data:image/png;base64,${data.captcha_img}">`;
                } else {
                    document.getElementById('captcha-img-container').innerText = '❌ दोबारा दबाएं';
                }
            } catch(e) {
                document.getElementById('captcha-img-container').innerText = '❌ कनेक्शन एरर';
            }
        }

        function askCaptchaDirect() {
            let tracking_no = prompt("यहाँ इंडिया पोस्ट का कूरियर नंबर लिखें:");
            if(!tracking_no) return;
            openCaptcha(null, tracking_no.toUpperCase());
        }

        function closePopup() {
            document.getElementById('captcha-box').style.display = 'none';
            document.getElementById('overlay').style.display = 'none';
        }

        document.getElementById('captcha-submit-btn').onclick = async function() {
            let captchaCode = document.getElementById('captcha-input').value;
            if(!captchaCode) { alert("कृपया कोड टाइप करें!"); return; }
            
            closePopup();
            
            if(currentActiveId) {
                await fetch('/api/refresh_shipment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: currentActiveId, captcha: captchaCode })
                });
                loadShipments();
            } else if(currentDirectTrackingNo) {
                let res = await fetch(`/api/track_direct?tracking_no=${currentDirectTrackingNo}&captcha=${captchaCode}`);
                let data = await res.json();
                alert(`📦 लाइव स्थिति:\n${data.status}`);
                loadShipments();
            }
        };

        async function addManualParcel() {
            let name = prompt("कस्टमर का नाम लिखें:"); if(!name) return;
            let tracking_no = prompt("AWB / ट्रैकिंग नंबर लिखें:"); if(!tracking_no) return;
            let mobile1 = prompt("10 अंकों का मोबाइल नंबर:"); if(!mobile1) return;

            let response = await fetch('/api/add_manual', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, tracking_no, mobile1 })
            });
            if(response.ok) { loadShipments(); }
        }

        function filterTab(type, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.card').forEach(card => {
                if(type === 'all' || card.getAttribute('data-status') === type) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        }

        async function deleteItem(id) {
            if(confirm("क्या आप इसे हटाना चाहते हैं?")) {
                let response = await fetch('/api/delete_shipment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: id })
                });
                if(response.ok) { loadShipments(); }
            }
        }
        window.onload = loadShipments;
    </script>
</body>
</html>
