<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SpeedPost Tracking Dashboard</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f7f9fa; margin: 0; padding: 10px; }
        .btn-group { display: flex; gap: 10px; margin-bottom: 15px; }
        .action-btn { flex: 1; border: none; padding: 12px; border-radius: 10px; font-weight: bold; font-size: 13px; cursor: pointer; color: white; }
        .add-btn { background: #007aff; }
        .track-btn { background: #34c759; }
        .tabs { display: flex; justify-content: space-around; background: white; padding: 12px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); margin-bottom: 15px; position: sticky; top: 0; z-index: 100; }
        .tab { font-weight: bold; color: #888; cursor: pointer; padding: 5px 15px; border-radius: 20px; transition: 0.2s; }
        .tab.active { color: white; background: #ff6b35; }
        .card { background: white; border-radius: 12px; padding: 15px; margin-bottom: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); display: flex; justify-content: space-between; align-items: center; border-left: 5px solid #ff6b35; }
        .card.delivered-border { border-left-color: #34c759; }
        .info h3 { margin: 0 0 5px 0; font-size: 16px; color: #222; text-transform: capitalize; }
        .info p { margin: 3px 0; font-size: 13px; color: #555; }
        .status { font-weight: bold; font-size: 13px; padding: 3px 8px; border-radius: 5px; display: inline-block; margin-top: 5px; }
        .status-transit { background: #e3f2fd; color: #007aff; }
        .status-delivered { background: #e8f5e9; color: #34c759; }
        .actions { display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
        .wa-btn { background-color: #25D366; color: white; border: none; padding: 8px 14px; border-radius: 8px; font-size: 12px; font-weight: bold; text-decoration: none; text-align: center; display: inline-flex; align-items: center; gap: 5px; }
        .refresh-btn { background: #e0e0e0; color: #333; border: none; padding: 5px 10px; border-radius: 5px; font-size: 11px; cursor: pointer; font-weight: bold; }
        .del-btn { background: none; color: #ff3b30; border: none; font-size: 12px; cursor: pointer; padding: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <div class="btn-group">
        <button class="action-btn add-btn" onclick="addManualParcel()">➕ नया पार्सल जोड़ें</button>
        <button class="action-btn track-btn" onclick="trackDirectCourier()">🔍 कूरियर ट्रैक करें</button>
    </div>

    <div class="tabs">
        <div class="tab active" onclick="filterTab('all', this)">All</div>
        <div class="tab" onclick="filterTab('shipping', this)">Shipping 🚚</div>
        <div class="tab" onclick="filterTab('delivered', this)">Delivered ✅</div>
    </div>

    <div id="shipments-container">
        <p style="text-align: center; color: #888;">लोड हो रहा है...</p>
    </div>

    <script>
        let tg = window.Telegram.WebApp;
        tg.expand();

        async function loadShipments() {
            try {
                let response = await fetch('/api/shipments');
                let data = await response.json();
                renderCards(data);
            } catch (e) {
                document.getElementById('shipments-container').innerHTML = '<p style="color:red; text-align:center;">त्रुटि!</p>';
            }
        }

        function renderCards(shipments) {
            let container = document.getElementById('shipments-container');
            container.innerHTML = '';
            if(shipments.length === 0) {
                container.innerHTML = '<p style="text-align:center; color:#bbbbbb; margin-top:50px;">कोई शिपमेंट नहीं मिला।</p>';
                return;
            }
            shipments.reverse().forEach(item => {
                let isDelivered = item.status.includes('Delivered');
                let statusClass = isDelivered ? 'status-delivered' : 'status-transit';
                let borderClass = isDelivered ? 'delivered-border' : '';
                
                let imgText = item.image_url ? `\n\n🖼️ पार्सल फोटो देखें: ${item.image_url}` : '';
                let waMsg1 = `नमस्ते ${item.name}! आपका पार्सल (${item.tracking_no}) का लाइव स्टेटस है: *${item.status}*।${imgText}`;
                let wa1 = `https://wa.me/91${item.mobile1}?text=${encodeURIComponent(waMsg1)}`;

                container.innerHTML += `
                    <div class="card ${borderClass}" data-status="${isDelivered ? 'delivered' : 'shipping'}">
                        <div class="info">
                            <h3>${item.name}</h3>
                            <p><b>#${item.tracking_no}</b></p>
                            <span class="status ${statusClass}" id="status-${item._id}">${item.status}</span>
                            <p style="font-size:11px; margin-top:8px;">📱 ${item.mobile1}</p>
                        </div>
                        <div class="actions">
                            <a href="${wa1}" target="_blank" class="wa-btn">🟢 WhatsApp</a>
                            <button class="refresh-btn" onclick="refreshItem('${item._id}')">🔄 रिफ्रेश स्टेटस</button>
                            <button class="del-btn" onclick="deleteItem('${item._id}')">🗑️ डिलीट</button>
                        </div>
                    </div>
                `;
            });
        }

        // 🔄 तुरंत लाइव स्टेटस दोबारा जांचने का फंक्शन
        async function refreshItem(id) {
            let statusSpan = document.getElementById(`status-${id}`);
            statusSpan.innerText = "🔄 चेकिंग...";
            let response = await fetch('/api/refresh_shipment', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ id: id })
            });
            if(response.ok) {
                let data = await response.json();
                statusSpan.innerText = data.status;
                if(data.status.includes('Delivered')) {
                    loadShipments(); // लिस्ट को रीलोड करें ताकि कलर बदल सके
                }
            } else {
                statusSpan.innerText = "❌ एरर";
            }
        }

        async function trackDirectCourier() {
            let tracking_no = prompt("यहाँ इंडिया पोस्ट का कूरियर नंबर लिखें:");
            if(!tracking_no) return;
            
            alert("डाक विभाग के लाइव सर्वर से स्टेटस निकाला जा रहा है, कृपया 5 सेकंड रुकें...");
            let response = await fetch(`/api/track_direct?tracking_no=${tracking_no.toUpperCase()}`);
            let data = await response.json();
            alert(`📦 कूरियर नंबर: ${tracking_no.toUpperCase()}\n⚡ लाइव स्टेटस: ${data.status}`);
        }

        async function addManualParcel() {
            let name = prompt("कस्टमर का नाम लिखें:"); if(!name) return;
            let tracking_no = prompt("AWB / ट्रैकिंग नंबर लिखें:"); if(!tracking_no) return;
            let mobile1 = prompt("10 अंकों का मोबाइल नंबर:"); if(!mobile1) return;

            let response = await fetch('/api/add_manual', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, tracking_no, mobile1 })
            });
            if(response.ok) { loadShipments(); }
        }

        function filterTab(type, element) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            element.classList.add('active');
            document.querySelectorAll('.card').forEach(card => {
                if(type === 'all' || card.getAttribute('data-status') === type) card.style.display = 'flex';
                else card.style.display = 'none';
            });
        }

        async function deleteItem(id) {
            if(confirm("क्या आप इसे हटाना चाहते हैं?")) {
                let response = await fetch('/api/delete_shipment', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ id: id })
                });
                if(response.ok) { loadShipments(); }
            }
        }
        window.onload = loadShipments;
    </script>
</body>
</html>
