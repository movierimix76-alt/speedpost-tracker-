services:
  - type: web
    name: awb-telegram-bot
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python app.py"
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: SESSION_STRING
        sync: false
      - key: GROUP
        sync: false
      - key: EXCEL_FILE
        value: awb.xlsx
      - key: OLD_MESSAGES_LIMIT
        value: "100000"
